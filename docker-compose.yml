services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mev_sentinel}
      MYSQL_USER: ${MYSQL_USER:-mev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      DEMO_MODE: ${DEMO_MODE:-true}
      ETH_WS_URL: ${ETH_WS_URL:-}
      ETH_HTTP_URL: ${ETH_HTTP_URL:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mev_sentinel}
      MYSQL_USER: ${MYSQL_USER:-mev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mev_password}
      WHALE_ETH_THRESHOLD: ${WHALE_ETH_THRESHOLD:-10}
      HIGH_GAS_GWEI_THRESHOLD: ${HIGH_GAS_GWEI_THRESHOLD:-20}
      VERY_HIGH_GAS_GWEI_THRESHOLD: ${VERY_HIGH_GAS_GWEI_THRESHOLD:-50}
      PENDING_TTL_SECONDS: ${PENDING_TTL_SECONDS:-180}
      MAX_MEMORY_TRANSACTIONS: ${MAX_MEMORY_TRANSACTIONS:-1500}
      MAX_MEMORY_SIGNALS: ${MAX_MEMORY_SIGNALS:-500}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mysql_data:
